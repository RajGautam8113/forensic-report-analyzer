app:
  secret_key: 'forensic-ai-super-secret-key-2026-prod'

upload:
  folder: 'uploads'
  allowed_extensions:
    - pdf
    - txt
    - docx
    - jpg
    - jpeg
    - png
    - bmp
    - tiff

database:
  path: 'data/forensic_reports.db'

server:
  host: '0.0.0.0'
  port: 8080
  debug: false

nlp:
  model_name: 'en_core_web_sm'

evidence:
  allowed_image_extensions:
    - jpg
    - jpeg
    - png
    - bmp
    - tiff
  allowed_video_extensions:
    - mp4
    - avi
    - mov
    - mkv
  max_files: 10
  max_file_size_mb: 50
  frame_interval_seconds: 2
  max_frames: 10

logging:
  level: 'INFO'
